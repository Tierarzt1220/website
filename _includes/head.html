<meta charset="utf-8">


{% unless site.atom_feed.hide %}
  <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

<!-- https://t.co/dKP3o1e -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="max-image-preview:large">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<!--fontawesome:-->
<link rel="stylesheet" href="{{ '/assets/css/fontawesome.all.min.css' | relative_url }}" >
<!-- Online version of font awesome - changed to local install <script src="https://kit.fontawesome.com/e00adbc1cd.js" crossorigin="anonymous"></script> -->
<!-- <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5/css/all.min.css"></noscript> -->

{% if site.head_scripts %}
  {% for script in site.head_scripts %}
    <script src="{{ script | relative_url }}"></script>
  {% endfor %}
{% endif %}
{% seo %}

{% if page.url == "/" or page.url == "/english/" or page.url == "/espanol/" or page.url == "/magyar/" %}
<link rel="alternate" hreflang="de-AT" href="{{ '/' | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ '/english/' | absolute_url }}">
<link rel="alternate" hreflang="es" href="{{ '/espanol/' | absolute_url }}">
