<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "CollectionPage",
      "@id": {{ page.url | absolute_url | append: '#karriere' | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "inLanguage": "de-AT",
      "about": { "@id": {{ site.url | append: '/#praxis' | jsonify }} },
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "url": {{ page.image | absolute_url | jsonify }},
        "width": {{ page.career.image_width }},
        "height": {{ page.career.image_height }}
      },
      "breadcrumb": { "@id": {{ page.url | absolute_url | append: '#breadcrumb' | jsonify }} }
    },
    {
      "@type": "BreadcrumbList",
      "@id": {{ page.url | absolute_url | append: '#breadcrumb' | jsonify }},
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Startseite", "item": {{ '/' | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 2, "name": "Jobs & Praktika", "item": {{ page.url | absolute_url | jsonify }} }
      ]
    }
  ]
}
</script>
